[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensmell"
version = "0.1.0"
description = "Open interoperability framework for digital olfaction"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opensmell = ["schemas/*.json"]