name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenSmell
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  interoperability:
    name: Portable Python / JavaScript interoperability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSmell
        run: python -m pip install -e ".[dev]"

      - name: Regenerate RFC-0007 ResourceGraph interoperability vectors
        run: python tools/generate_resource_graph_vectors.py

      - name: Verify generated RFC-0007 vectors are reproducible
        run: git diff --exit-code -- examples/resource_graph_interop_vectors.json

      - name: Verify RFC-0007 ResourceGraph vectors in JavaScript
        run: node tools/verify_resource_graph_vectors.js

      - name: Verify RFC-0007 JavaScript round-trip in Python
        run: python tools/verify_resource_graph_vectors_roundtrip.py

      - name: Verify RFC-0007 portable conformance in Python
        run: pytest tests/test_experimental_resource_graph_conformance_vectors.py -q

      - name: Verify RFC-0007 portable conformance in JavaScript
        run: node tools/verify_resource_graph_conformance.js

      - name: Verify identifier golden vectors in JavaScript
        run: node tools/verify_identifier_vectors.js

      - name: Verify identifier torture vectors in JavaScript
        run: node tools/verify_identifier_torture_vectors.js

      - name: Verify RFC-0008 generic graph conformance in JavaScript
        run: node tools/verify_generic_resource_graph_conformance.js

      - name: Verify RFC-0008 generic graph interoperability in JavaScript
        run: node tools/verify_generic_resource_graph_vectors.js

      - name: Verify RFC-0008 JavaScript round-trip in Python
        run: python tools/verify_generic_resource_graph_vectors_roundtrip.py

      - name: Verify Molecule conformance in JavaScript
        run: node tools/verify_molecule_conformance.js

      - name: Verify Annotation conformance in JavaScript
        run: node tools/verify_annotation_conformance.js

      - name: Verify Annotation ResourceGraph interoperability in JavaScript
        run: node tools/verify_annotation_resource_graph_vectors.js

      - name: Verify structural reference discovery in JavaScript
        run: node tools/verify_reference_discovery_vectors.js

      - name: Verify enriched OdorNet interoperability fixture in JavaScript
        run: node tools/verify_odornet_enriched_interop.js
