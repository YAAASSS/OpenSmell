name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Select documented Node reference runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Record runtime versions
        run: |
          python --version
          node --version

      - name: Install OpenSmell
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Verify installed wheel CLI outside the checkout
        run: |
          python -m build --wheel
          python -m tools.verify_installed_cli dist/*.whl

  interoperability:
    name: Portable Python / JavaScript interoperability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install OpenSmell
        run: python -m pip install -e ".[dev]"

      - name: Verify locally packed JavaScript SDK outside the checkout
        run: node tools/verify_js_sdk.cjs "$RUNNER_TEMP/js-sdk-exchange"

      - name: Verify installed SDKs with Python and Node and exchanged bytes
        run: |
          python -m build --wheel
          python -m tools.verify_installed_cli dist/*.whl --js-exchange-directory "$RUNNER_TEMP/js-sdk-exchange"

      - name: Verify installed explicit Core planning path
        run: |
          python -m tools.verify_installed_core_plan dist/opensmell-0.1.0-py3-none-any.whl --evidence-directory dist/core-plan-proof
          python -m tools.verify_installed_js_core dist/opensmell-0.1.0-py3-none-any.whl --output dist/core-plan-proof/js-reader
          python -m tools.verify_installed_core_perceptual dist/opensmell-0.1.0-py3-none-any.whl --output dist/core-plan-proof/perceptual
          python -m tools.verify_installed_observation_core dist/opensmell-0.1.0-py3-none-any.whl --output dist/core-plan-proof/observation-export

      - name: Retain Core planning evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: core-planning-proof
          path: dist/core-plan-proof
          retention-days: 14

      - name: Verify installed caller trial-table experiment
        run: python -m tools.verify_installed_experiment dist/opensmell-0.1.0-py3-none-any.whl --evidence-directory dist/experiment-proof

      - name: Verify passive installed trial observation analysis
        run: python -m tools.verify_installed_trial_analysis dist/opensmell-0.1.0-py3-none-any.whl --output dist/experiment-proof/analysis

      - name: Retain portable caller experiment proof
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: caller-experiment-proof
          path: dist/experiment-proof
          retention-days: 14

      - name: Verify installed bounded sequences on Python and independent Node
        run: python -m tools.verify_installed_sequence dist/opensmell-0.1.0-py3-none-any.whl --evidence-directory dist/sequence-proof

      - name: Retain experimental sequence receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: software-sequence-proof
          path: dist/sequence-proof
          retention-days: 14

      - name: Verify installed GraphML with independent NetworkX consumer
        run: python -m tools.verify_installed_reference_graph dist/opensmell-0.1.0-py3-none-any.whl --evidence-directory dist/reference-graph-proof

      - name: Retain experimental graph interoperability proof
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reference-graph-networkx-proof
          path: dist/reference-graph-proof
          retention-days: 14

      - name: Verify installed observation export with optional Pandas consumer
        run: python -m tools.verify_installed_analysis dist/opensmell-0.1.0-py3-none-any.whl

      - name: Build and try the portable local developer kit
        run: |
          python -m tools.build_developer_kit --output dist/opensmell-developer-kit.zip
          python -m tools.verify_developer_kit dist/opensmell-developer-kit.zip

      - name: Verify installed selected perceptual import and JavaScript transfer
        run: python -m tools.verify_installed_perceptual dist/opensmell-0.1.0-py3-none-any.whl

      - name: Retain the verified experimental kit
        uses: actions/upload-artifact@v7.0.2
        with:
          name: opensmell-local-developer-kit
          path: dist/opensmell-developer-kit.zip
          retention-days: 14

      - name: Verify installed JavaScript lifecycle client against Python and Node
        run: |
          node --test tests/lifecycle_client.test.cjs
          node tools/verify_js_lifecycle.cjs dist/opensmell-0.1.0-py3-none-any.whl

      - name: Verify independent software lifecycle adapter
        run: |
          python -m tools.verify_lifecycle_adapter --endpoint python
          python -m tools.verify_lifecycle_adapter --endpoint node
          python -m pytest tests/test_lifecycle_adapter_example.py -q

      - name: Verify Local Explorer import handling in JavaScript
        run: node --test tests/local_demo_import.test.cjs tests/local_demo_lifecycle.test.cjs

      - name: Verify independent JavaScript graph reader and intact transfers
        run: node --test tests/graph_viewer_js.test.cjs tests/js_sdk.test.cjs tests/core_reader_js.test.cjs

      - name: Verify JavaScript reader exchange with Python Local Explorer
        run: python -m pytest tests/test_graph_viewer_js_exchange.py -q

      - name: Regenerate RFC-0007 ResourceGraph interoperability vectors
        run: python tools/generate_resource_graph_vectors.py

      - name: Verify generated RFC-0007 vectors are reproducible
        run: git diff --exit-code -- examples/resource_graph_interop_vectors.json

      - name: Verify RFC-0007 ResourceGraph vectors in JavaScript
        run: node tools/verify_resource_graph_vectors.js

      - name: Verify RFC-0007 JavaScript round-trip in Python
        run: python tools/verify_resource_graph_vectors_roundtrip.py

      - name: Verify RFC-0007 portable conformance in Python
        run: python -m pytest tests/test_experimental_resource_graph_conformance_vectors.py -q

      - name: Verify RFC-0007 portable conformance in JavaScript
        run: node tools/verify_resource_graph_conformance.js

      - name: Verify identifier golden vectors in JavaScript
        run: node tools/verify_identifier_vectors.js

      - name: Verify identifier torture vectors in JavaScript
        run: node tools/verify_identifier_torture_vectors.js

      - name: Verify RFC-0008 generic graph conformance in JavaScript
        run: node tools/verify_generic_resource_graph_conformance.js

      - name: Verify RFC-0008 generic graph interoperability in JavaScript
        run: node tools/verify_generic_resource_graph_vectors.js

      - name: Verify RFC-0008 JavaScript round-trip in Python
        run: python tools/verify_generic_resource_graph_vectors_roundtrip.py

      - name: Verify Molecule conformance in JavaScript
        run: node tools/verify_molecule_conformance.js

      - name: Verify Annotation conformance in JavaScript
        run: node tools/verify_annotation_conformance.js

      - name: Verify Annotation ResourceGraph interoperability in JavaScript
        run: node tools/verify_annotation_resource_graph_vectors.js

      - name: Verify structural reference discovery in JavaScript
        run: node tools/verify_reference_discovery_vectors.js

      - name: Verify enriched OdorNet interoperability fixture in JavaScript
        run: node tools/verify_odornet_enriched_interop.js

      - name: Verify Device Protocol 0.1 portable conformance in Python
        run: python -m pytest tests/test_experimental_device_protocol_conformance_vectors.py -q

      - name: Verify Device Protocol 0.1 portable conformance in JavaScript
        run: node tools/verify_device_protocol_conformance.js

  offline-kit:
    name: Clean offline kit / Linux x86_64 CPython 3.12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Prepare build tools and explicitly acquire pinned dependencies
        run: |
          python -m pip install ".[dev]"
          python -m tools.offline_dependencies --output "$RUNNER_TEMP/offline-dependencies"
      - name: Verify clean wheel-only starter with no network interfaces
        run: |
          python -m build --wheel
          sudo --preserve-env=PATH unshare --net "$(command -v python)" -m tools.verify_installed_starter dist/opensmell-0.1.0-py3-none-any.whl --dependency-directory "$RUNNER_TEMP/offline-dependencies" --evidence-directory dist/starter-proof
      - name: Retain clean wheel-only starter evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: clean-wheel-starter-proof
          path: dist/starter-proof
          retention-days: 14
      - name: Build optional offline target without publishing
        run: python -m tools.build_developer_kit --wheelhouse "$RUNNER_TEMP/offline-dependencies" --output dist/opensmell-offline-linux-cp312.zip
      - name: Verify clean installation and full trials with no network namespace interfaces
        run: sudo --preserve-env=PATH unshare --net "$(command -v python)" -m tools.verify_developer_kit dist/opensmell-offline-linux-cp312.zip --offline
      - name: Retain the verified experimental offline target
        uses: actions/upload-artifact@v7.0.2
        with:
          name: opensmell-offline-linux-cp312
          path: dist/opensmell-offline-linux-cp312.zip
          retention-days: 14

  molecular-interoperability:
    name: Optional RDKit molecular interoperability / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install explicit optional scientific consumer environment
        run: python -m pip install . "build>=1.2" "pytest>=8" rdkit==2025.9.6
      - name: Test actual molecule parsing and SDF round-trip
        run: python -m pytest -q tests/test_rdkit_example.py tests/test_scientific_plan_trial.py
      - name: Build wheel and verify installed SDK with independent SDF reader
        run: |
          python -m build --wheel
          python -m tools.verify_installed_rdkit dist/opensmell-0.1.0-py3-none-any.whl --evidence-directory dist/rdkit-proof
      - name: Retain experimental molecular interoperability evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rdkit-molecular-interoperability-proof
          path: dist/rdkit-proof
          retention-days: 14

  lsl-interoperability:
    name: Optional actual LSL marker interoperability / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install SDK and explicitly acquire optional pinned LSL runtime
        run: |
          python -m pip install . "build>=1.2" "pytest>=8"
          python -m pip download --only-binary=:all: --dest dist/lsl-dependencies pylsl==1.18.7 numpy==2.2.6
      - name: Verify marker projection without optional SDK dependency
        run: python -m pytest -q tests/test_lsl_example.py
      - name: Verify installed SDK with actual separate LSL receiver
        run: |
          python -m build --wheel
          python -m tools.verify_installed_lsl dist/opensmell-0.1.0-py3-none-any.whl --dependency-directory dist/lsl-dependencies --evidence-directory dist/lsl-proof
      - name: Retain actual LSL evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: optional-lsl-marker-proof
          path: dist/lsl-proof
          retention-days: 14
